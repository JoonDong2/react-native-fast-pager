name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # A push releases a patch. Put [minor] anywhere in one of the pushed
      # commit messages to release a minor instead, which is what a change to
      # documented behaviour needs: a prop default, a callback's timing, a
      # new prop. The messages are read from the environment instead of being
      # interpolated into the script, so a commit message cannot inject shell.
      - name: Bump version
        env:
          PUSHED_COMMIT_MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          CURRENT_MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          if [ "$CURRENT_MAJOR" = "0" ]; then
            BUMP=major
          elif printf '%s' "$PUSHED_COMMIT_MESSAGES" | grep -qF '[minor]'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "Releasing a $BUMP bump"
          npm version "$BUMP" -m 'chore: bump version to %s'

      - name: Build
        run: yarn prepare

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version bump
        run: git push --follow-tags
